name: Release Gate & Heavy Verification

on:
  workflow_dispatch:
    inputs:
      run_noise_trials:
        description: 'Run 500 noise trials verification'
        required: true
        type: boolean
        default: true

jobs:
  release-gate:
    name: Full Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Pytest suite
        run: |
          python -m pytest tests/ -v

      - name: Run All Verification Scripts
        run: |
          python -c "
          import subprocess, sys, glob
          scripts = sorted(glob.glob('experiments/verify_*.py'))
          for s in scripts:
              print(f'=== Running {s} ===')
              res = subprocess.run([sys.executable, s])
              if res.returncode != 0:
                  sys.exit(res.returncode)
          print('ALL VERIFICATION SCRIPTS PASSED.')
          "
