name: CI

on:
  push:
    branches: [ "main", "v0.2-dev", "v0.3-dev", "v0.4-dev", "v0.5-dev", "v0.5.1-dev", "v0.6-dev", "v0.7-dev", "v0.8-dev", "v0.9-dev", "v1.0-rc", "v1.0" ]
  pull_request:
    branches: [ "main", "v0.2-dev", "v0.3-dev", "v0.4-dev", "v0.5-dev", "v0.5.1-dev", "v0.6-dev", "v0.7-dev", "v0.8-dev", "v0.9-dev", "v1.0-rc", "v1.0" ]

jobs:
  test:
    name: Regression & Fast Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Pytest suite
        run: |
          python -m pytest tests/ -q

      - name: Run Fast Verification Scripts
        run: |
          python experiments/verify_rdp_math.py
          python experiments/verify_budget_precision.py
          python experiments/verify_same_key_concurrency.py
          python experiments/verify_fencing.py
          python experiments/verify_policy_binding_atomicity.py
          python experiments/verify_recipient_collusion.py
          python experiments/verify_planner_architecture.py
          python experiments/verify_continual_tree_math.py
          python experiments/verify_continual_node_reuse.py
          python experiments/verify_continual_accounting.py
          python experiments/verify_continual_multiworker.py
          python experiments/verify_continual_epoch_history.py
