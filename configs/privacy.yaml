privacy:
  privacy_unit: user
  adjacency: add_remove

  horizon:
    days: 90

  global_budget:
    epsilon: 4.0
    delta: 4.0e-6

  default_query_budget:
    epsilon: 1.0
    delta: 1.0e-6

  accountant:
    mode: rdp
    epsilon_cap: 4.0
    delta_global: 1.0e-6
    orders:
      - 1.25
      - 1.5
      - 2.0
      - 3.0
      - 4.0
      - 5.0
      - 8.0
      - 10.0
      - 16.0
      - 32.0
      - 64.0
      - 128.0

  history:
    mode: lifetime

  recipient_composition:
    mode: global_external

  default_mechanism:
    type: gaussian

  release:
    reuse_existing_release: true
    allow_budget_overrun: false
