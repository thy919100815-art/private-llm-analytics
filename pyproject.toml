[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "private-llm-analytics"
version = "0.1.7"
description = "User-level Central Differential Privacy Analytics Layer for Enterprise Multi-LLM Telemetry"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Private LLM Analytics Research Team" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.9",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
private_llm_analytics = [
    "web/templates/*.html",
    "web/static/*.css",
    "web/static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
